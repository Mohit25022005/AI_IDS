apiVersion: v1
kind: Service
metadata:
  name: ids-frontend
  namespace: default
  labels:
    app: ids
    component: frontend
spec:
  selector:
    app: ids
    component: frontend
  # Use LoadBalancer for cloud; NodePort for local minikube
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
