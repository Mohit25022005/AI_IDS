apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ids-backend-hpa
  namespace: default
  labels:
    app: ids
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ids-backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Scale down conservatively to avoid cold-start latency spikes
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type:          Pods
          value:         1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type:          Pods
          value:         2
          periodSeconds: 30
