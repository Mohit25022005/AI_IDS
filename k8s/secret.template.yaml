# ============================================================
# Cloud-RT-IDS  ·  Kubernetes Secret Template
# ============================================================
# INSTRUCTIONS:
#   1. Base64-encode your values:
#        echo -n "your-api-key" | base64
#   2. Fill in the data fields below
#   3. Apply:  kubectl apply -f k8s/secret.yaml
#   4. NEVER commit the filled-in secret.yaml to version control
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: ids-secret
  namespace: default
  labels:
    app: ids
type: Opaque
data:
  # Base64-encoded API key.  Leave empty string ("") to disable auth.
  IDS_API_KEY: ""   # replace with: echo -n "your-key" | base64
