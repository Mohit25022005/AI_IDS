apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-frontend
  namespace: default
  labels:
    app: ids
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ids
      component: frontend
  template:
    metadata:
      labels:
        app: ids
        component: frontend
    spec:
      containers:
        - name: ids-frontend
          image: ids-frontend:latest   # replace with registry/image:tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu:    "100m"
              memory: "64Mi"
            limits:
              cpu:    "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds:       15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds:       10
