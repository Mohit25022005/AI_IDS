apiVersion: v1
kind: ConfigMap
metadata:
  name: ids-config
  namespace: default
  labels:
    app: ids
data:
  IDS_HOST:        "0.0.0.0"
  IDS_PORT:        "5000"
  IDS_LOG_LEVEL:   "INFO"
  IDS_DEBUG:       "false"
  IDS_MAX_HISTORY: "10000"
  IDS_CORS_ORIGINS: "http://localhost:8080,http://ids-frontend"
